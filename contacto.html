<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contacto - Pawchi Blind Boxes</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <header id="encabezado">
        </header>

        <main>
            <div id="contacto-pawchi">
                <div class="contacto-informacion">
                    <h2>Contacto</h2>
                    <p>Escríbenos para resolver tus dudas sobre las blind boxes.</p>
                    <p>Correo: contacto@pawchi.com</p>
                </div>

                <div class="formulario-contacto">
                    <div class="campo">
                        <label>Nombre</label>
                        <input type="text" name="nombre">
                    </div>
                    <div class="campo">
                        <label>Correo Electrónico</label>
                        <input type="email" name="email">
                    </div>
                    <div class="campo">
                        <label>Mensaje</label>
                        <textarea name="mensaje"></textarea>
                    </div>
                    <div class="campo">
                        <button type="submit" class="boton">Enviar Mensaje</button>
                    </div>
                </div>
            </div>
        </main>

        <footer id="pie">
        </footer>

        <script src="js/main.js"></script>
    </body>
</html>
