<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Carrito | Pawchi</title>
        <link rel="stylesheet" href="estilos/style.css">
    </head>
    <body>
        <header id="encabezado">
        </header>
        <main>
            <h1>Carrito de compras</h1>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Accion</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-carrito">
                    </tbody>
                </table>
            </div>
            <p class="total">
                Total:
                <span id="total-carrito">$0</span>
            </p>
            <button class="peligro" onclick="vaciarCarrito()">Vaciar carrito</button>
        </main>
        <footer id="pie">
        </footer>
        <script src="scripts/datos.js">
        </script>
        <script src="scripts/cuentas.js"></script>
        <script src="scripts/componentes.js">
        </script>
        <script src="scripts/app.js">
        </script>
    </body>
</html>
