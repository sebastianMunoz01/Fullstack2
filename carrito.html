<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Carrito | Pawchi</title>
        <link rel="stylesheet" href="estilos/style.css">
    </head>
    <body>
        <header id="encabezado">
        </header>

        <main>
            <section id="carrito-pawchi">
                <h1>Carrito de compras</h1>

                <div class="item-carrito">
                    <p>Producto: Caja Sorpresa Pawchi</p>
                    <p>Precio: $10.000</p>
                    <p>Cantidad: 1</p>
                    <button type="button">Eliminar</button>
                </div>

                <div class="carrito-total">
                    <p>
                        Total:
                        <span id="total-carrito">$10.000</span>
                    </p>

                    <button type="button">
                        Vaciar carrito
                    </button>
                </div>
            </section>
        </main>

        <footer id="pie">
        </footer>

        <script src="js/main.js"></script>
    </body>
</html>
