<!DOCTYPE html>

        <title>Carrito | Pawchi</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

        <main>

        </main>

        <footer id="pie"></footer>

        <!-- Enlazamos los scripts en el orden correcto -->
        <script src="js/datos.js"></script>
        <script src="js/componentes.js"></script>
